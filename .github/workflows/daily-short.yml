name: weekly-panchang-shorts

# Renders a full week of Panchang shorts in one run and uploads them to YouTube,
# each scheduled to go public at 06:00 IST on its own day.
#
# Why weekly instead of a 05:00-daily cron: GitHub's `schedule` trigger is
# best-effort and routinely fires hours late (and occasionally skips a day), so
# a same-morning render kept missing the 05:00 window. A weekly batch has days
# of slack — cron jitter no longer matters — and YouTube's `publishAt` still
# releases each short at exactly 06:00 IST. Panchang is a pure astronomical
# calculation, so rendering a future date is as correct as rendering today
# (panchang_short.py anchors each date to *its own* sunrise).
#
# Runs off the VM by design: ffmpeg encoding on the e2-micro would recreate the
# CPU spike that degrades the live API. See PIPELINE_SPEC.md §2 and §5.
#
# NOTE: GitHub disables a scheduled workflow after 60 days with no repo commits.
# If this repo goes quiet, push any commit (or run it manually) to keep it live.

on:
  schedule:
    # Sat 19:30 UTC = Sun 01:00 IST (IST is UTC+5:30; cron's day-of-week is UTC,
    # so Sunday 01:00 IST falls on Saturday's UTC date). Renders the coming
    # week Sun→Sat; even hours of scheduler drift leave a large release buffer.
    - cron: '30 19 * * 6'
  workflow_dispatch:
    inputs:
      date:
        description: 'week start YYYY-MM-DD (blank = today IST)'
        required: false
        default: ''
      days:
        description: 'how many days to render from the start date'
        required: false
        default: '7'
      langs:
        description: 'space-separated language codes'
        required: false
        default: 'en'
      privacy:
        description: 'public (schedule each at 06:00 IST) | unlisted | private'
        required: false
        default: 'public'

# One run at a time; never let two publishers race.
concurrency:
  group: panchang-shorts
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # to open an issue when a run fails

jobs:
  render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # 7 renders + 90s staggers between them
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Python deps
        run: pip install pillow edge-tts google-api-python-client google-auth google-auth-oauthlib requests

      - name: Render the week
        run: |
          set -euo pipefail
          LANGS="${{ github.event.inputs.langs || 'en' }}"
          DAYS="${{ github.event.inputs.days || '7' }}"
          BASE="${{ github.event.inputs.date }}"
          # Anchor the week to the IST calendar day, not the runner's UTC clock
          # or GitHub's (often hours-late) fire time. Every date is pinned
          # explicitly with --date, so the render is fully deterministic.
          [ -n "$BASE" ] || BASE=$(TZ='Asia/Kolkata' date +%F)
          echo "Rendering $DAYS day(s) from $BASE (IST), langs: $LANGS"
          mkdir -p out
          first=1
          for i in $(seq 0 $((DAYS - 1))); do
            D=$(date -u -d "$BASE +$i day" +%F)
            for L in $LANGS; do
              # Stagger every render: never hit the single API worker in a burst
              # (PIPELINE_SPEC.md §2). Sequential + spaced keeps the live API calm.
              [ "$first" -eq 1 ] || sleep 90
              first=0
              echo "--- render $D ($L) ---"
              python3 panchang_short.py --lang "$L" --out out/ --date "$D"
            done
          done

      - name: Publish to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PRIVACY="${{ github.event.inputs.privacy || 'public' }}"
          NOW=$(date -u +%s)

          # Each rendered file is panchang_<YYYY-MM-DD>_<lang>.mp4. A public
          # upload is scheduled to flip public at 06:00 IST (00:30 UTC) of its
          # OWN date — derived from the filename, so every day in the batch gets
          # its correct release time and cron jitter can't slip it. If a day's
          # 06:00 IST is already in the past (a run that landed very late, or a
          # backfill), publish it immediately — still the correct day, and
          # YouTube rejects a publishAt in the past. unlisted/private runs skip
          # scheduling and upload at that privacy now (handy for test runs).
          shopt -s nullglob
          published=0
          for F in out/*.mp4; do
            FDATE=$(basename "$F" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            ARGS=""
            if [ "$PRIVACY" = "public" ] && [ -n "$FDATE" ]; then
              T=$(date -u -d "${FDATE}T00:30:00Z" +%s)
              if [ "$T" -gt "$NOW" ]; then
                AT=$(date -u -d "@$T" +%Y-%m-%dT%H:%M:%SZ)
                ARGS="--at $AT"
                echo "$(basename "$F") -> public at $AT (06:00 IST $FDATE)"
              else
                echo "$(basename "$F") -> 06:00 IST $FDATE passed; publishing now"
              fi
            fi
            # upload has its own date-based duplicate guard, so re-running the
            # week is a per-day no-op rather than a double post.
            python3 publish_youtube.py upload "$F" \
              --privacy "$PRIVACY" --channel "@MediniJyotishEn" $ARGS
            published=1
          done
          [ "$published" -eq 1 ] || { echo "No rendered mp4 to publish"; exit 1; }

      - name: Upload rendered shorts as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Date().toISOString().slice(0, 10);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly shorts failed — ${day}`,
              body: [
                'The `weekly-panchang-shorts` workflow failed — the week may be',
                'incomplete. Some days in the batch may have uploaded before the',
                'failure; check the channel and re-run (per-day duplicate guard',
                'makes a re-run safe).',
                '',
                `Run log: ${run}`,
                '',
                'Common causes: edge-tts endpoint unreachable (falls back to silence, so',
                'this is usually the YouTube step), an expired `YT_REFRESH_TOKEN`, or the',
                'API being down. See README.md and PIPELINE_SPEC.md §9.',
              ].join('\n'),
            });
